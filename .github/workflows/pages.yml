name: Deploy mockups to GitHub Pages

# Publishes only the three public files, so the .git folder and any other
# project files never go to the site. Runs on each push to main.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. A newer push cancels an older queued deploy, so
# nothing waits behind a stuck run.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Collect the site files
        run: |
          mkdir _site
          cp index.html kiitab-speaker-hardware.html _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
